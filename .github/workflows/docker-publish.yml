name: Publish image

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE: ${{ github.repository_owner }}/zatedb

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # GITHUB_TOKEN needs package write scope to push to GHCR; no long-lived
      # registry credential to store or rotate.
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          # Persist the layer cache in the registry itself so `npm ci` (the
          # slow step, run twice by the multi-stage build) is reused across
          # runs instead of rebuilt from scratch on every merge.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache,mode=max
