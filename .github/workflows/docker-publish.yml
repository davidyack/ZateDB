name: Publish image

on:
  push:
    branches: [main]

env:
  IMAGE: zatedb

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    env:
      # Set as a repo/org secret rather than hardcoded so the registry
      # hostname isn't public in a public repo.
      REGISTRY: ${{ secrets.ACR_HOST_NAME }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Registry-wide admin credential. It is shared and unscoped, so any push
      # it makes is attributable only to "the registry admin" — rotate it with
      # `az acr credential renew -n <registry-name> --password-name password`
      # if it ever leaks, and prefer a repo-scoped OIDC identity if this
      # graduates past demo use.
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:latest
          # Persist the layer cache in the registry itself so `npm ci` (the
          # slow step, run twice by the multi-stage build) is reused across
          # runs instead of rebuilt from scratch on every merge.
          cache-from: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.REGISTRY }}/${{ env.IMAGE }}:buildcache,mode=max
